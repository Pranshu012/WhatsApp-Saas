spring:
  application.name: wasaas
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wasaas}
    username: ${DB_USER:wasaas_app}
    password: ${DB_PASSWORD:wasaas_app_password}
    hikari.maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wasaas}
    user: ${FLYWAY_USER:wasaas}
    password: ${FLYWAY_PASSWORD:localdev}
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 24h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
logging.pattern.console: "%d{ISO8601} %-5level [%X{requestId}] %logger{36} - %msg%n"
app:
  meta:
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    graph-version: ${META_GRAPH_VERSION:v21.0}
    webhook-verify-token: ${META_WEBHOOK_VERIFY_TOKEN:}
  crypto.token-key: ${TOKEN_ENCRYPTION_KEY:}
  jobs:
    poll-interval-ms: 1000
    batch-size: 10
    lock-timeout-secs: 300
