<style>

html,body{margin:0;padding:0}

.wrap{max-width:960px;margin:0 auto;padding:0 20px 80px}

/* header */
header{border-bottom:1.5px solid var(--ink);padding:26px 0 16px;margin-bottom:22px}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

.sub{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-top:5px}

.track-tog button{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 13px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.track-tog button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* meter */
.meter{margin-top:18px}
.meter-top{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.bar{height:5px;background:var(--rule);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--done);transition:width .35s cubic-bezier(.4,0,.2,1)}

/* next-up: the signature panel */
.next{border:1.5px solid var(--ink);background:var(--panel);padding:20px;margin:22px 0 26px;position:relative}
.next::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--now)}
.next .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--now);font-weight:600}
.next h2{font-family:"Space Grotesk",sans-serif;font-size:21px;margin:7px 0 3px;letter-spacing:-.01em}
.next .code{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-soft)}
.next .note{margin-top:11px;font-size:13.5px;color:var(--warn);border-left:2px solid var(--warn);padding-left:10px}
.reads{margin-top:15px;display:flex;flex-direction:column;gap:5px}
.rlabel{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px}
.nextact{margin-top:16px;display:flex;gap:9px;flex-wrap:wrap}

/* chip = copyable @mention */
.chip{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--paper);border:1px solid var(--rule);

.chip:hover{border-color:var(--now);color:var(--now)}
.chip.ok{border-color:var(--done);color:var(--done)}
.btn{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;

.rail{border-left:1.5px solid var(--rule);margin-left:7px}

.step[data-s=done]::before{background:var(--done);border-color:var(--done)}
.step[data-s=now]::before{background:var(--now);border-color:var(--now);box-shadow:0 0 0 3px rgba(35,71,155,.16)}

.box{flex:0 0 auto;width:17px;height:17px;border:1.5px solid var(--ink-soft);border-radius:2px;background:var(--panel);

.box[aria-checked=true]{background:var(--done);border-color:var(--done)}
.box[aria-checked=true]::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;
  border:solid var(--panel);border-width:0 1.5px 1.5px 0;transform:rotate(42deg)}
.sbody{flex:1;min-width:0}
.sh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.sid{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;color:var(--ink-soft);flex:0 0 auto}
.st{font-weight:500}
.step[data-s=done] .st{text-decoration:line-through;text-decoration-color:var(--off);color:var(--ink-soft)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;

.snote{font-size:13px;color:var(--warn);margin-top:4px}
.sdocs{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}

/* docs tab */
.search{width:100%;font-family:"IBM Plex Mono",monospace;font-size:13px;padding:11px 13px;

.hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px}
.fgroup{margin-bottom:18px}
.fgroup h4{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;

.frow.ok{border-color:var(--done);color:var(--done)}

footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--rule);

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(70px);

.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.hide{display:none !important}
@media (max-width:600px){h1{font-size:21px}.next h2{font-size:18px}.wrap{padding:0 14px 60px}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

ODE/README.md", "14-CLAUDE-CODE/WORKFLOW.md", "SOURCE-architecture-and-cost-strategy.md", "START-HERE-MANUAL.txt"]};
const DOCROOT = "docs/WhatsApp-SaaS-Product/";
const KEY = "wasaas.buildlog.v1";
let state = {done:{}, track:"pilot"};

/* storage: Claude artifact store -> localStorage -> memory */
async function load(){
  try{ if(window.storage){ const r = await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value);} }catch(e){}
  try{ const v = localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
  return null;
}
async function save(){
  const s = JSON.stringify(state);
  try{ if(window.storage){ await window.storage.set(KEY, s); return; } }catch(e){}
  try{ localStorage.setItem(KEY, s); }catch(e){}
}

const $ = s => document.querySelector(s);
let toastT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1500); }

function copy(text, el){
  const done=()=>{ toast("Copied  "+text); if(el){el.classList.add("ok"); setTimeout(()=>el.classList.remove("ok"),1100);} };
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(()=>fb()); } else fb();
  function fb(){ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity=0;
    document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");done();}catch(e){toast("Copy failed");} ta.remove(); }
}

const active = s => state.track==="full" ? true : s.pilot!=="skip";
function visible(){ return DATA.steps.filter(active); }
function nextStep(){ return visible().find(s=>!state.done[s.id]); }

function renderMeter(){
  const v=visible(), d=v.filter(s=>state.done[s.id]).length;
  const p = v.length? Math.round(d/v.length*100):0;
  $("#mLabel").textContent = d+" of "+v.length+" done";
  $("#mPct").textContent = p+"%";
  $("#mBar").style.width = p+"%";
}

function docChips(docs, prompt){
  let h="";
  if(docs&&docs.length){
    h+='<div class="rlabel">Read first</div>';
    h+=docs.map(d=>'<button class="chip" data-copy="@'+DOCROOT+d+'">@'+d+'</button>').join(" ");
  }
  if(prompt){
    h+='<div class="rlabel" style="margin-top:11px">Prompt</div>';
    h+='<button class="chip" data-copy="@'+DOCROOT+'14-CLAUDE-CODE/PROMPTS/'+prompt+'">@14-CLAUDE-CODE/PROMPTS/'+prompt+'</button>';
  }
  return h;
}

function renderNext(){
  const s = nextStep(), c = $("#nextCard");
  if(!s){ c.innerHTML = '<div class="eyebrow">Complete</div><h2>Every step on this track is done.</h2>'+
    '<div class="code">Switch to the Full track, or open 00-START-HERE/PILOT-FIRST-PLAN.md for what comes next.</div>'; return; }
  c.innerHTML =
    '<div class="eyebrow">Do this now</div>'+
    '<h2>'+s.id+' &middot; '+s.title+'</h2>'+
    '<div class="code">'+s.phase+(s.size&&s.size!=="-"?"  &middot;  "+s.size:"")+
      (s.pilot==="simple"?"  &middot;  simplified for pilot":"")+'</div>'+
    (s.note?'<div class="note">'+s.note+'</div>':'')+
    '<div class="reads">'+docChips(s.docs,s.prompt)+'</div>'+
    '<div class="nextact"><button class="btn" data-mark="'+s.id+'">Mark '+s.id+' done</button></div>';
}

function renderSteps(){
  const phases=[]; visible().forEach(s=>{ if(!phases.includes(s.phase)) phases.push(s.phase); });
  const nx = nextStep();
  $("#paneBuild").innerHTML = phases.map(p=>{
    const items = visible().filter(s=>s.phase===p);
    const d = items.filter(s=>state.done[s.id]).length;
    return '<section class="phase"><div class="phase-h"><h3>'+p+'</h3><span>'+d+'/'+items.length+'</span></div><div class="rail">'+
      items.map(s=>{
        const isDone=!!state.done[s.id], st= isDone?"done":(nx&&nx.id===s.id?"now":"todo");
        return '<div class="step" data-s="'+st+'">'+
          '<button class="box" role="checkbox" aria-checked="'+isDone+'" data-mark="'+s.id+'" aria-label="Toggle '+s.id+'"></button>'+
          '<div class="sbody"><div class="sh"><span class="sid">'+s.id+'</span><span class="st">'+s.title+'</span>'+
          (s.size&&s.size!=="-"?'<span class="tag">'+s.size+'</span>':'')+
          (s.pilot==="simple"?'<span class="tag simple">simplified</span>':'')+
          (s.pilot==="skip"?'<span class="tag skip">post-pilot</span>':'')+
          '</div>'+
          (s.note?'<div class="snote">'+s.note+'</div>':'')+
          ((s.docs.length||s.prompt)?'<div class="sdocs">'+
            s.docs.map(x=>'<button class="chip" data-copy="@'+DOCROOT+x+'">@'+x.split("/").pop()+'</button>').join("")+
            (s.prompt?'<button class="chip" data-copy="@'+DOCROOT+'14-CLAUDE-CODE/PROMPTS/'+s.prompt+'">@'+s.prompt+'</button>':'')+
          '</div>':'')+
          '</div></div>';
      }).join("")+'</div></section>';
  }).join("");
}

function renderFiles(filter){
  const f=(filter||"").toLowerCase().trim();
  const hit = DATA.files.filter(x=>!f||x.toLowerCase().includes(f));
  const groups={};
  hit.forEach(x=>{ const g = x.includes("/")? x.split("/")[0] : "root"; (groups[g]=groups[g]||[]).push(x); });
  const keys=Object.keys(groups).sort((a,b)=> a==="root"?-1: b==="root"?1: a.localeCompare(b));
  $("#fileList").innerHTML = hit.length? keys.map(g=>
    '<div class="fgroup"><h4>'+g+' <span style="color:var(--off)">('+groups[g].length+')</span></h4><div class="flist">'+
    groups[g].map(x=>'<button class="frow" data-copy="@'+DOCROOT+x+'">'+x+'</button>').join("")+'</div></div>'
  ).join("") : '<p class="hint">Nothing matches “'+f+'”. Try a shorter word — rls, webhook, backup, meta, pilot.</p>';
}

function renderAll(){ renderMeter(); renderNext(); renderSteps(); }

document.addEventListener("click", e=>{
  const c=e.target.closest("[data-copy]"); if(c){ copy(c.dataset.copy, c); return; }
  const m=e.target.closest("[data-mark]"); if(m){ const id=m.dataset.mark;
    state.done[id]=!state.done[id]; save(); renderAll();
    if(state.done[id]){ const n=nextStep(); if(n) toast("Next: "+n.id+" · "+n.title); } return; }
});
$("#tabBuild").onclick=()=>{ $("#tabBuild").setAttribute("aria-selected","true"); $("#tabDocs").setAttribute("aria-selected","false");
  $("#paneBuild").classList.remove("hide"); $("#paneDocs").classList.add("hide"); };
$("#tabDocs").onclick=()=>{ $("#tabDocs").setAttribute("aria-selected","true"); $("#tabBuild").setAttribute("aria-selected","false");
  $("#paneDocs").classList.remove("hide"); $("#paneBuild").classList.add("hide"); $("#q").focus(); };
$("#q").oninput=e=>renderFiles(e.target.value);
$("#tPilot").onclick=()=>{ state.track="pilot"; $("#tPilot").setAttribute("aria-pressed","true"); $("#tFull").setAttribute("aria-pressed","false"); save(); renderAll(); };
$("#tFull").onclick=()=>{ state.track="full"; $("#tFull").setAttribute("aria-pressed","true"); $("#tPilot").setAttribute("aria-pressed","false"); save(); renderAll(); };
$("#reset").onclick=()=>{ if(confirm("Clear all ticks? This cannot be undone.")){ state.done={}; save(); renderAll(); toast("Progress cleared"); } };

(async ()=>{ const s = await load(); if(s){ state = Object.assign(state, s); }
  $("#tPilot").setAttribute("aria-pressed", String(state.track!=="full"));
  $("#tFull").setAttribute("aria-pressed", String(state.track==="full"));
  renderAll(); renderFiles("");
})();
</script></body></html>
